AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Maleicultura - FastAPI on Lambda + HTTP API

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        GRAPH_API_VERSION: v20.0
        WHATSAPP_VERIFY_TOKEN: '{{resolve:ssm:/maleicultura/whatsapp_verify_token}}'
        WHATSAPP_TOKEN: '{{resolve:ssm:/maleicultura/whatsapp_token}}'
        WHATSAPP_PHONE_NUMBER_ID: '{{resolve:ssm:/maleicultura/phone_number_id}}'
        GEMINI_API_KEY: '{{resolve:ssm:/maleicultura/gemini_api_key}}'
        OPENAI_API_KEY: '{{resolve:ssm:/maleicultura/openai_api_key}}'
        DEEPSEEK_API_KEY: '{{resolve:ssm:/maleicultura/deepseek_api_key}}'
        CONV_TABLE: conversations
        CONV_TOKEN_LIMIT: "2000"
        CONV_TTL_DAYS: "7"

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.handler
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:DescribeTable
              - dynamodb:DeleteItem
              - dynamodb:Scan
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt ConversationsTable.Arn
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
  ConversationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: conversations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: wa_from
          AttributeType: S
        - AttributeName: ts
          AttributeType: N
      KeySchema:
        - AttributeName: wa_from        
          KeyType: HASH
        - AttributeName: ts        
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

Outputs:
  ApiEndpoint:
    Description: Endpoint HTTP público
    Value: !Sub https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com
